<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffd6f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Brilhinhos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="sky"></div>
  <header id="hud">
    <button id="hud-level" class="hud-pill" aria-label="Seu nível">
      <span class="lvl-ring"><span id="hud-lvl">1</span></span>
      <span class="lvl-bar"><i id="hud-xp"></i></span>
    </button>
    <div class="hud-pill"><span class="ico">🪙</span><b id="hud-coins">0</b></div>
    <div class="hud-pill" title="Brilho de Crescer"><span class="ico">🌟</span><b id="hud-grow">0</b></div>
    <div class="hud-space"></div>
    <button id="hud-gift" class="hud-btn" hidden aria-label="Presente do dia">🎁<i class="dot"></i></button>
    <button id="hud-bag" class="hud-btn" aria-label="Mochila">🎒</button>
    <button id="hud-medals" class="hud-btn" aria-label="Medalhas">🏅</button>
    <button id="hud-opts" class="hud-btn" aria-label="Ajustes">⚙️</button>
  </header>
  <main id="screen"></main>
  <nav id="nav">
    <button data-go="mapa"><span>🗺️</span>Mapa</button>
    <button data-go="ninho"><span>🌈</span>Ninho</button>
    <button data-go="fazenda"><span>🏡</span>Fazendinha</button>
    <button data-go="amigos"><span>💞</span>Amigos</button>
    <button data-go="codice"><span>📖</span>Códice</button>
    <button data-go="pedidos"><span>📜</span>Pedidos<i class="dot" hidden></i></button>
  </nav>
  <div id="guide" hidden><img alt=""><p></p></div>
  <div id="modal-root"></div>
  <div id="fx"></div>
  <div id="splash"><div class="logo">Brilhinhos</div><div class="sub">carregando a magia…</div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
